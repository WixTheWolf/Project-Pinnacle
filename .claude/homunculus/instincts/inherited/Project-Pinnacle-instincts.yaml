# Agent Role Boundaries

## Action

Cursor/Claude agents implement features. Codex sub-agents (explorer, reviewer, docs-researcher) are read-only. ecc-tools[bot] generates config only — regenerate ECC after structural app changes, never overwrite app code in parallel.

## Evidence

- AGENTS.md agent roles table
- .codex/agents/*.toml sandbox_mode = read-only

